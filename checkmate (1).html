<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#07080f" />
<title>CHECKMATE — Glass Orbit</title>
<style>
  :root {
    color-scheme: dark;
    --accent: hsl(38 85% 68%);
    --glow: hsla(38, 85%, 68%, .35);
    --ink: #eef0f8;
    --muted: rgba(226, 230, 245, .58);
    --line: rgba(255, 255, 255, .13);
    --lv: 0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #07080f; }
  body {
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ambient colour blobs so the glass has something to refract */
  .blobs { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 120%, #101426, #07080f 60%); }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: calc(.34 + var(--lv) * .35); will-change: transform; }
  .blob.b1 { width: 46vmax; height: 46vmax; left: -10vmax; top: -12vmax; background: var(--accent); animation: drift1 26s ease-in-out infinite alternate; }
  .blob.b2 { width: 42vmax; height: 42vmax; right: -12vmax; top: 18vh; background: #3b4fd8; animation: drift2 31s ease-in-out infinite alternate; }
  .blob.b3 { width: 36vmax; height: 36vmax; left: 25vw; bottom: -20vmax; background: #14a3a0; animation: drift3 23s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(18vw, 14vh) scale(1.2); } }
  @keyframes drift2 { to { transform: translate(-16vw, -10vh) scale(.9); } }
  @keyframes drift3 { to { transform: translate(12vw, -16vh) scale(1.25); } }

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #cvBack { z-index: 1; }
  #cvFront { z-index: 3; }

  .glass {
    position: relative;
    background: linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.03));
    -webkit-backdrop-filter: blur(22px) saturate(170%);
    backdrop-filter: blur(22px) saturate(170%);
    border: 1px solid var(--line);
    box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.24), inset 0 -1px 0 rgba(255,255,255,.04);
  }
  .glass::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(115deg, rgba(255,255,255,.14) 0%, transparent 32%, transparent 70%, rgba(255,255,255,.05) 100%);
  }

  /* piece */
  #piece { position: fixed; z-index: 2; left: 0; top: 0; pointer-events: none; will-change: transform;
    filter: drop-shadow(0 0 22px var(--glow)) drop-shadow(0 26px 22px rgba(0,0,0,.5)); }
  #pieceSvg { display: block; width: 100%; height: 100%; overflow: visible; }
  #pg { transition: opacity .18s ease, transform .3s ease; transform-origin: 150px 250px; }
  #pg.swap { opacity: 0; transform: scale(.92) translateY(10px); }
  #pg .g { fill: url(#gl); stroke: rgba(255,255,255,.12); stroke-width: 1; }
  #pg .b { fill: url(#gl2); stroke: rgba(255,255,255,.1); stroke-width: 1; }
  #pg .ln { fill: none; stroke: rgba(255,255,255,.18); stroke-width: 1.6; stroke-linecap: round; }

  /* top bar */
  .topbar { position: fixed; z-index: 6; left: 0; right: 0; top: 0; padding: 16px clamp(14px, 2.6vw, 34px); display: flex; align-items: center; justify-content: space-between; gap: 14px; pointer-events: none; }
  .topbar > * { pointer-events: auto; }
  .brand { display: flex; align-items: center; gap: 12px; padding: 8px 14px 8px 8px; border-radius: 16px; }
  .brand-mark { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-size: 19px; color: var(--accent); background: rgba(255,255,255,.07); border: 1px solid var(--line); }
  .brand-name { font-weight: 800; letter-spacing: .22em; font-size: 13px; white-space: nowrap; }
  .brand-name span { color: var(--accent); }
  .brand-cap { font-size: 9px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; margin-top: 3px; }
  .hint { padding: 9px 16px; border-radius: 999px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .hint b { color: var(--ink); font-weight: 700; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 8px 15px; border-radius: 999px; cursor: pointer; font-size: 12px; font-weight: 600;
    background: rgba(255,255,255,.07); border: 1px solid var(--line); transition: transform .2s ease, border-color .25s ease, background .25s ease, box-shadow .25s ease; }
  .btn:hover { transform: translateY(-1px); border-color: var(--accent); background: rgba(255,255,255,.11); }
  .btn.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 20%, transparent); box-shadow: 0 0 22px var(--glow); }
  .btn.solid { background: color-mix(in srgb, var(--accent) 38%, rgba(255,255,255,.06)); border-color: color-mix(in srgb, var(--accent) 70%, transparent); }
  .btn.sm { min-height: 34px; padding: 6px 10px; font-size: 11px; border-radius: 12px; }

  /* panel */
  .panel { position: fixed; z-index: 5; right: 20px; top: 78px; bottom: 20px; width: 300px; border-radius: 24px; padding: 18px; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 15px;
    transition: transform .95s cubic-bezier(.7, 0, .2, 1); scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent; }
  .panel[data-ui="left"] { transform: translateX(calc(-100vw + 340px)); }
  .panel[data-ui="drawer"] { transform: translateY(calc(100% - 62px)); }
  .ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 28px; }
  .eyebrow { font-size: 9px; font-weight: 800; letter-spacing: .17em; text-transform: uppercase; color: var(--accent); }
  .ph h2 { margin: 4px 0 0; font-size: 14px; letter-spacing: .02em; }
  .live { width: 8px; height: 8px; border-radius: 50%; background: #62e0a0; box-shadow: 0 0 0 4px rgba(98,224,160,.18), 0 0 14px #62e0a0; flex: none; }
  .feat { display: flex; flex-direction: column; gap: 8px; }
  .frow { display: flex; align-items: center; gap: 11px; padding: 10px 11px; border-radius: 14px; background: rgba(255,255,255,.05); border: 1px solid var(--line); }
  .fi { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; flex: none; color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); font-size: 15px; }
  .frow b { font-size: 12px; display: block; }
  .frow small { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; line-height: 1.35; }
  .frow > div:nth-child(2) { flex: 1; min-width: 0; }
  .meter { width: 40px; height: 5px; border-radius: 9px; background: rgba(255,255,255,.1); overflow: hidden; flex: none; }
  .meter i { display: block; height: 100%; width: 0; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .divider { height: 1px; background: var(--line); flex: none; }
  .lbl { display: flex; justify-content: space-between; align-items: center; font-size: 9px; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .lbl output { color: var(--accent); font-variant-numeric: tabular-nums; }
  .pname { font-size: 24px; font-weight: 720; letter-spacing: -.03em; margin-top: 8px; color: var(--accent); }
  .pdesc { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.5; min-height: 32px; }
  .pgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-top: 10px; }
  .po { aspect-ratio: 1; border-radius: 11px; cursor: pointer; font-family: Georgia, serif; font-size: 20px; color: var(--muted); background: rgba(255,255,255,.05); border: 1px solid var(--line); transition: all .2s ease; }
  .po:hover { transform: translateY(-2px); color: var(--ink); }
  .po.active { color: var(--accent); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .ctl { display: flex; flex-direction: column; gap: 7px; }
  input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .full { width: 100%; }
  .status { padding: 10px 12px; border-radius: 14px; background: color-mix(in srgb, var(--accent) 10%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent); }
  .status .sl { font: 800 9px ui-monospace, Menlo, monospace; letter-spacing: .12em; color: var(--accent); }
  .status .st { margin-top: 4px; font-size: 10px; color: var(--muted); line-height: 1.5; }

  /* piece wheel: a big quarter-disc in the bottom-left corner, 3 coins visible at a time */
  .wheel { --S: clamp(210px, 38vmin, 330px); position: fixed; z-index: 5; left: 0; bottom: 0; width: var(--S); height: var(--S);
    border-radius: 0 100% 0 0; border-left: 0; border-bottom: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; outline-offset: -4px; }
  .wheel:active { cursor: grabbing; }
  .wring { position: absolute; width: calc(var(--S) * 2); height: calc(var(--S) * 2); left: calc(var(--S) * -1); bottom: calc(var(--S) * -1); border-radius: 50%;
    transform: rotate(var(--wr, 0deg)); will-change: transform; pointer-events: none; }
  .wring::before { content: ""; position: absolute; inset: 3%; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.34) 0 1deg, transparent 1deg 5deg);
    -webkit-mask: radial-gradient(circle closest-side, transparent 88%, #000 89%, #000 95%, transparent 96%); mask: radial-gradient(circle closest-side, transparent 88%, #000 89%, #000 95%, transparent 96%); }
  .wg { position: absolute; left: 0; bottom: 0; width: calc(var(--S) * .27); height: calc(var(--S) * .27); margin: 0 0 calc(var(--S) * -.135) calc(var(--S) * -.135);
    display: grid; place-items: center; border-radius: 50%; font: calc(var(--S) * .17) Georgia, serif; color: var(--muted); opacity: 0; visibility: hidden; will-change: transform, opacity;
    background: rgba(255,255,255,.05); border: 1px solid var(--line); transition: color .2s, background .2s, box-shadow .2s, border-color .2s; pointer-events: none; }
  .wg.sel { color: var(--accent); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: 0 0 20px var(--glow); }
  .wnotch { position: absolute; left: 0; bottom: 0; width: 0; height: 0; transform: rotate(-45deg); pointer-events: none; }
  .wnotch::after { content: ""; position: absolute; left: calc(var(--S) - 16px); top: -7px; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-right: 11px solid var(--accent); filter: drop-shadow(0 0 6px var(--glow)); }
  .whub { position: absolute; left: 16px; bottom: 14px; text-align: left; pointer-events: none; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; color: var(--accent); }
  .whub small { display: block; font-size: 8px; color: var(--muted); margin-top: 3px; letter-spacing: .1em; }
  @media (max-width: 759px) { .wheel { --S: 200px; } .whub { left: 12px; bottom: 10px; font-size: 9px; } }
  .tb-right { display: flex; gap: 8px; align-items: center; }
  .btn:disabled { opacity: .55; pointer-events: none; }
  /* corner dock: zoom button that opens into a thin bar */
  .dock { position: fixed; z-index: 6; right: 20px; bottom: 20px; height: 52px; width: 52px; border-radius: 26px; overflow: hidden; display: flex; align-items: center; white-space: nowrap;
    transition: width .6s cubic-bezier(.7, 0, .2, 1), border-radius .6s ease; }
  .dock[data-open="true"] { width: min(560px, calc(100vw - 40px)); border-radius: 18px; }
  .dk-toggle { flex: none; width: 52px; height: 52px; display: grid; place-items: center; background: none; border: 0; cursor: pointer; color: var(--ink); transition: color .25s ease; }
  .dk-toggle svg { width: 22px; height: 22px; }
  .dk-toggle:hover, .dock[data-open="true"] .dk-toggle { color: var(--accent); }
  .dk-rest { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; padding-right: 14px; opacity: 0; pointer-events: none; transition: opacity .25s ease; }
  .dock[data-open="true"] .dk-rest { opacity: 1; pointer-events: auto; transition-delay: .25s; }
  .dk-ic { flex: none; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; cursor: pointer; font-size: 17px; background: rgba(255,255,255,.07); border: 1px solid var(--line); transition: transform .2s ease, border-color .25s ease; }
  .dk-ic:hover { transform: translateY(-1px); border-color: var(--accent); }
  .dk-sliders { display: flex; gap: 14px; flex: 1; min-width: 0; padding-left: 8px; }
  .dk-s { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 60px; color: var(--muted); font-size: 14px; }
  .dk-s i { font-style: normal; flex: none; }
  .dk-s input { width: 100%; min-width: 0; }
  @media (max-width: 759px) { .dock { right: 12px; bottom: 12px; } .dock[data-open="true"] { width: calc(100vw - 24px); } .dk-sliders { gap: 8px; } }
  .toast { position: fixed; z-index: 9; left: 50%; bottom: 24px; transform: translate(-50%, 14px); opacity: 0; pointer-events: none; padding: 10px 18px; border-radius: 999px; font-size: 11px; letter-spacing: .06em; transition: opacity .3s ease, transform .35s ease; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 1050px) { .hint { display: none; } }
  @media (max-width: 759px) {
    .panel { left: 12px; right: 12px; width: auto; top: auto; height: 42vh; bottom: 12px; }
    .panel[data-ui="left"] { transform: none; }
    .panel[data-ui="drawer"] { transform: translateY(calc(100% - 56px)); }
    .brand-cap { display: none; }
    .btn span.t { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .blob { animation: none; } }
</style>
</head>
<body>
<div class="blobs" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<canvas id="cvBack" aria-hidden="true"></canvas>

<div id="piece" aria-label="Chess piece">
  <svg id="pieceSvg" viewBox="0 0 300 400" role="img" aria-label="King">
    <defs>
      <linearGradient id="gl" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".58" />
        <stop offset=".46" style="stop-color:var(--accent)" stop-opacity=".24" />
        <stop offset="1" stop-color="#fff" stop-opacity=".07" />
      </linearGradient>
      <linearGradient id="gl2" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity=".3" />
        <stop offset=".5" style="stop-color:var(--accent)" stop-opacity=".16" />
        <stop offset="1" stop-color="#fff" stop-opacity=".1" />
      </linearGradient>
    </defs>
    <g id="pg"></g>
  </svg>
</div>
<canvas id="cvFront" aria-hidden="true"></canvas>

<header class="topbar">
  <div class="brand glass" style="border-radius:16px">
    <div class="brand-mark" aria-hidden="true">♘</div>
    <div>
      <div class="brand-name">CHECK<span>MATE</span></div>
      <div class="brand-cap">Track Alpha · Vibe · C2 Active</div>
    </div>
  </div>
  <div class="hint glass"><b>Glide slow</b> → outline stretches · <b>Slice fast</b> → scatter &amp; shatter</div>
  <div class="tb-right">
    <button type="button" class="btn glass" id="magBtn" aria-pressed="false" title="Magnet: stones and the piece outline lean toward your cursor, then snap back">🧲 <span class="t" id="magTxt">Magnet off</span></button>
    <button type="button" class="btn glass" id="gravBtn" title="Gravity: everything falls, then comes back">⬇ <span class="t">Gravity</span></button>
    <button type="button" class="btn glass" id="soundBtn" aria-pressed="false">♫ <span class="t" id="soundTxt">Sound off</span></button>
  </div>
</header>

<div class="dock glass" id="dock" data-open="false">
  <button type="button" class="dk-toggle" id="dockToggle" aria-expanded="false" aria-label="Open controls" title="Controls">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/><path d="M8 10.5h5M10.5 8v5" stroke-width="1.6"/></svg>
  </button>
  <div class="dk-rest">
    <button type="button" class="dk-ic" id="morphBtn" title="Morph layout" aria-label="Morph layout">⇄</button>
    <button type="button" class="dk-ic" id="regroupBtn" title="Regroup stones" aria-label="Regroup stones">↺</button>
    <button type="button" class="dk-ic" id="pulseBtn" title="Pulse" aria-label="Pulse">◎</button>
    <div class="dk-sliders">
      <label class="dk-s" title="Outline elasticity"><i>≈</i><input id="rElastic" type="range" min="30" max="160" value="100" aria-label="Outline elasticity" /></label>
      <label class="dk-s" title="Scatter force"><i>✦</i><input id="rScatter" type="range" min="30" max="160" value="100" aria-label="Scatter force" /></label>
      <label class="dk-s" title="Stone density"><i>⁘</i><input id="rStones" type="range" min="150" max="900" step="10" value="650" aria-label="Stone density" /></label>
    </div>
  </div>
</div>

<div class="wheel glass" id="wheel" data-side="left" role="slider" tabindex="0" aria-label="Piece wheel: turn to choose a chess piece" aria-valuemin="0" aria-valuemax="5" aria-valuetext="King">
  <div class="wring" id="wRing" aria-hidden="true"></div>
  <div class="wnotch" aria-hidden="true"></div>
  <div class="whub"><div id="wName">King</div><small>turn ↻</small></div>
</div>

<div class="toast glass" id="toast" role="status" aria-live="polite"></div>

<noscript><div style="position:fixed;inset:0;display:grid;place-items:center;z-index:99;background:#07080f;color:#fff">This interactive piece needs JavaScript.</div></noscript>

<script>
(() => {

  const $ = (s) => document.querySelector(s) || DUMMY;

  /* ---------- state ---------- */
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const W = { w: 0, h: 0, dpr: 1 };
  const cvB = $('#cvBack'), cvF = $('#cvFront');
  const cb = cvB.getContext('2d'), cf = cvF.getContext('2d');
  const panel = $('#panel'), pieceEl = $('#piece');
  const L = { cx: 0, cy: 0, size: 300 };
  let cur = 'king', hue = 38, li = 0;
  let elastic = 1, scatterF = 1, activeN = reduced ? 380 : 650;
  let level = 0, energy = 0, attract = 0, scatters = 0;
  let pulled = false, peak = 0, cutFlash = 0;
  const P = { x: -999, y: -999, t: 0, sp: 0, inside: false };

      const a = 1 - age / 380;
      ctx.strokeStyle = `hsla(${hue},90%,80%,${a * .9})`; ctx.shadowColor = `hsla(${hue},95%,70%,1)`; ctx.shadowBlur = 16;

  /* ---------- main loop ---------- */
  let last = performance.now(); const t0 = last; let fn = 0;
  function frame(now) {
    const dt = clamp((now - last) / 16.667, .3, 3); last = now; const t = (now - t0) / 1000; fn++;
    // layout easing
    const tg = layoutTarget(), le = 1 - Math.pow(.93, dt);
    L.cx += (tg.cx - L.cx) * le; L.cy += (tg.cy - L.cy) * le; L.size += (tg.size - L.size) * le;
    // pointer state
    if (now - P.t > 50) P.sp *= Math.pow(.9, dt);
    const want = P.inside && P.sp <= FAST && !grav && gy < 1 ? 1 : 0;
    attract += (want - attract) * (1 - Math.pow(want ? .85 : .7, dt));
    mag += (((magnet && P.inside && !grav && gy < 1) ? 1 : 0) - mag) * (1 - Math.pow(.9, dt));
    cutFlash *= Math.pow(.9, dt); energy *= Math.pow(.95, dt);
    if (shattered) {
      shatterT += dt / 60;
      if (shatterT > 4.3) { shattered = false; shards.length = 0; boardAlpha = 0; cutFlash = 1; reformSound();
      for (const st of stones) { st.x = L.cx + (Math.random() - .5) * L.size * 1.4; st.y = L.cy + (Math.random() - .5) * L.size * 1.4; st.vx = 0; st.vy = 0; st.free = 0; st.spin = st.sp0; } status('FIELD / LIVE', 'The glass re-formed. Slice fast across the board to break it again.'); }
    } else boardAlpha = Math.min(1, boardAlpha + .02 * dt);
    stoneA = shattered ? clamp(1 - shatterT / 1.5, 0, 1) : Math.min(1, stoneA + .035 * dt);
    // gravity: the board falls, tilts and bounces; then eases back when gravity ends
    const maxGy = Math.max(0, W.h - 6 - (L.cy + L.size / 2));
    if (grav) {
      gvy += .22 * dt; gy += gvy * dt;
      if (gy > maxGy) { gy = maxGy; if (gvy > 1.5) gvy *= -.3; else gvy = 0; }
      gr += (gTilt - gr) * (1 - Math.pow(.93, dt));
    } else if (gy > .3 || Math.abs(gr) > .001) {
      gy += (0 - gy) * (1 - Math.pow(.92, dt)); gr += (0 - gr) * (1 - Math.pow(.92, dt)); gvy = 0;
      if (gy < .3 && Math.abs(gr) < .001) { gy = 0; gr = 0; }
    }
    wheelStep(dt);
    // audio level
    let lv = 0;
    if (V() && A.an) { A.an.getByteFrequencyData(A.data); let s = 0; for (let i = 0; i < A.data.length; i++) s += A.data[i]; lv = Math.min(1, s / A.data.length / 255 * 2.8); }
    level += (Math.max(lv, energy * .6) - level) * .22;
    // where the glass piece sits this frame (outline stones trace its silhouette)
    const psz = L.size * .38, psc = psz / 300, S = 1 + level * .02, RS = Math.max(120, L.size * .35); let qx = 0, qy = 0, pullMax = 0;
    if (P.inside) { const dx = L.cx - P.x, dy = L.cy - P.y, d = Math.hypot(dx, dy) || 1, inf = clamp(1 - d / (L.size * .45), 0, 1); qx = dx / d * 7 * inf; qy = dy / d * 7 * inf; }
    const bcx = L.cx + qx, bcy = L.cy + qy + Math.sin(t * 1.1) * 2.5;
    let dispSum = 0; const RMg = L.size * .75;
    // stones

      const s = stones[i];
      if (grav) {
        if (s.gd === undefined || s.gd < -1e8) s.gd = 0;
        if (s.gd > 0) s.gd -= dt;
        else {
          s.vy += .3 * dt; s.vx *= Math.pow(.998, dt); s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.spin * dt;
          const fl = W.h - 3 - s.s * 1.3 - (s.fl || 0);
          if (s.y > fl) { s.y = fl; if (s.vy > 1.2) { s.vy *= -.38; s.vx *= .7; s.spin *= .6; } else { s.vy = 0; s.vx *= .8; s.spin *= .7; } }
          if (s.x < 2) { s.x = 2; s.vx = Math.abs(s.vx) * .5; } else if (s.x > W.w - 2) { s.x = W.w - 2; s.vx = -Math.abs(s.vx) * .5; }

        if (q) { T.x = bcx + (q.x - 150) * psc * S; T.y = bcy - 32 * psc + (q.y - 200) * psc * S; } else { T.x = s.x; T.y = s.y; }
        T.f = true; dispSum += Math.hypot(T.x - s.x, T.y - s.y);
        // slow cursor: outline stones are tugged toward it like a tied elastic
        if (P.inside && attract > .01) {
          const pdx = P.x - T.x, pdy = P.y - T.y, pd = Math.hypot(pdx, pdy);
          if (pd < RS) {
            const kk = Math.pow(1 - pd / RS, 2) * .28 * elastic * attract; let mx = pdx * kk, my = pdy * kk; const ml = Math.hypot(mx, my);
            if (ml > 40) { mx *= 40 / ml; my *= 40 / ml; }
            T.x += mx; T.y += my; if (ml > pullMax) pullMax = ml;
          }
        }
      } else {
        if (s.delay > 0) s.delay -= dt; else if (s.mode !== s.pm) s.mode = s.pm;
        target(s, s.mode, t);
      }
      if (mag > .01) {
        const mdx = P.x - T.x, mdy = P.y - T.y, md = Math.hypot(mdx, mdy), Rg = s.o ? RMg : RMg * 1.4;
        if (md < Rg) {
          const kk = Math.pow(1 - md / Rg, 1.4) * (s.o ? .85 : .7) * mag, cap = L.size * (s.o ? .14 : .28); let mx = mdx * kk, my = mdy * kk; const ml = Math.hypot(mx, my);
          if (ml > cap) { mx *= cap / ml; my *= cap / ml; }

      const ks = free ? .006 : (s.o ? .1 : .07);

      if (P.inside && P.sp < FAST && mag < .3 && i < activeN) {
        const dx = s.x - P.x, dy = s.y - P.y, d2 = dx * dx + dy * dy;
        if (d2 < 4900) { const d = Math.sqrt(d2) || 1, f = (1 - d / 70) * .22 * dt; s.vx += dx / d * f; s.vy += dy / d * f; }

    if (P.inside) minD = Math.max(0, Math.hypot(P.x - bcx, P.y - bcy) - psz * .4);

      const tt = i / NP * 4, side = Math.floor(tt), f = tt - side, p = op[i];
      let x, y;
      if (side === 0) { x = -half + f * L.size; y = -half; } else if (side === 1) { x = half; y = -half + f * L.size; }
      else if (side === 2) { x = half - f * L.size; y = half; } else { x = -half; y = half - f * L.size; }

    for (let i = 0; i < NP; i++) {

    }
    if (V() && A.tG) {
      const tn = pulled ? clamp(maxD / 45, 0, 1) * .05 : 0, c = A.ctx.currentTime;
      A.tG.gain.setTargetAtTime(tn, c, .05); A.tO.frequency.setTargetAtTime(PIECES[cur].root * .5 + maxD * 4, c, .05);
    }

    drawBoard(t); drawFront(dt);
    // piece
    const sizePx = L.size * .38; pieceEl.style.width = sizePx + 'px'; pieceEl.style.height = sizePx * 4 / 3 + 'px';
    let pxo = 0, pyo = 0, rx = 0, ry = 0;
    if (P.inside) {
      const dx = L.cx - P.x, dy = L.cy - P.y, d = Math.hypot(dx, dy) || 1, inf = clamp(1 - d / (L.size * .45), 0, 1);
      pxo = dx / d * 7 * inf; pyo = dy / d * 7 * inf;

    }
    pieceEl.style.transform = `translate3d(${(L.cx + pxo).toFixed(1)}px,${(L.cy + pyo + Math.sin(t * 1.1) * 2.5).toFixed(1)}px,0) translate(-50%,-58%) perspective(700px) rotateX(${rx.toFixed(1)}deg) rotateY(${ry.toFixed(1)}deg) scale(${(1 + level * .02).toFixed(3)})`;
    pieceEl.style.opacity = clamp(1 - dispAvg / 55, .15, 1).toFixed(2);
    root.style.setProperty('--lv', level.toFixed(3));
    if (fn % 6 === 0) { $('#meter').style.width = Math.round(level * 100) + '%'; $('#fCanvas').textContent = activeN + ' ring stones · ' + OUTN + '-stone piece outline'; }
    requestAnimationFrame(frame);
  }

  /* ---------- init ---------- */
  initStones(); resize(); setAccent();
  { const tg = layoutTarget(); L.cx = tg.cx; L.cy = tg.cy; L.size = tg.size; }
  for (const s of stones) { target(s, 0, 0); s.x = T.x; s.y = T.y; s.f = T.f; }

  window.addEventListener('resize', resize);
